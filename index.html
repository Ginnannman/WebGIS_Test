<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'none';
      script-src 'self';
      style-src 'self';
      img-src 'self' data:
        https://cyberjapandata.gsi.go.jp
        https://tile.openstreetmap.jp
        https://*.tile.opentopomap.org
        https://tile.mierune.co.jp;
      connect-src 'self'
        https://query.wikidata.org
        https://www.wikidata.org
        https://tile.shayato.net
        https://cyberjapandata.gsi.go.jp;
      base-uri 'none';
      form-action 'none';
      object-src 'none'
    ">
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ウェブGISテスト</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <script src="vendor/leaflet/leaflet.js"></script>
    <link rel="stylesheet" href="css/L.Control.MapCenterCoord.css"/>
    <link rel="stylesheet" href="css/Icon.css">
    <script src="js/L.Control.MapCenterCoord.js"></script>
    <script src="js/leaflet-hash.js"></script>
    <script src="js/mesh.js"></script>
    <script src="vendor/protomaps-leaflet/protomaps-leaflet.js"></script>
    <script src="js/bearing.js"></script>
    <script src="js/gsi-layers.js"></script>

  </head>
  
  <body>
    <div id="map"></div>
    <div id="wikidataSearchBox">
      <input id="wikidataFilterInput" type="text" placeholder="例：城、寺院…" autocomplete="off">
      <ul id="wikidataSuggestList"></ul>
   </div>
    <script src="js/index.js"></script>
  </body>
</html>
